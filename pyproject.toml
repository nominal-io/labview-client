# Docs toolchain only. This repo is LabVIEW; Python is here for Sphinx.
# Install with `uv sync --group docs`; build with `just build-docs`.
[project]
name = "nominal-labview-docs"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
docs = [
    # Sphinx 11 removes APIs that MyST still uses.
    "sphinx>=9.1,<11",
    "myst-parser>=4",
    "sphinx-design>=0.6",
    "sphinx-copybutton>=0.5",
    "nominal-sphinx-theme",
]

[tool.uv.sources]
# github.com/nominal-io/nominal-sphinx-theme. `just build-docs` and `just serve-docs` use the newest
# commit on its main; the commit in uv.lock is only their fallback when GitHub can't be reached.
nominal-sphinx-theme = { git = "https://github.com/nominal-io/nominal-sphinx-theme" }
